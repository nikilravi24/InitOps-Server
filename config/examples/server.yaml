# InitOps-Server - Full Server Configuration
vpn:
  provider: "both"

ollama:
  enabled: true
  model: "auto"
  gpu_acceleration: true

services:
  raspap: false
  pihole: true
  n8n: true
  samba: true
  sterling_pdf: true
  cockpit: true
  grafana: true

nginx:
  domain: "server.example.com"
  ssl: "letsencrypt"
  auth:
    provider: "authelia"
    users: []

network:
  interface: "eth0"
  ap_interface: "wlan0"